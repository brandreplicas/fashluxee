    <!-- Carousel & Interactive logic -->
    <script>
        const images = JSON.parse( Object.fromEntries(new URLSearchParams(location.search))['urls']);
        let currentIndex = 0;

        const imgEl = document.getElementById('preview-image');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const bulletsContainer = document.getElementById('bullets-container');
        const whatsappBtn = document.getElementById('whatsapp-btn');
        const downloadBtn = document.getElementById('download-btn');

        // Initialize carousel controls & bullets
        function initCarousel() {
            if (images.length > 1) {
                // Show Prev/Next buttons
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');

                // Generate Bullet Dots
                bulletsContainer.innerHTML = '';
                images.forEach((_, index) => {
                    const dot = document.createElement('div');
                    dot.className = `w-2 h-2 rounded-full cursor-pointer transition-all duration-300 ${index === 0 ? 'bg-[#c8a97e] scale-125 shadow-[0_0_8px_#c8a97e]' : 'bg-white/30 hover:bg-white/60'}`;
                    dot.onclick = () => goToSlide(index);
                    bulletsContainer.appendChild(dot);
                });
            } else {
                bulletsContainer.classList.add('hidden');
            }
            updateSlide(0);
        }

        // Transition slide smoothly with subtle opacity fade
        function updateSlide(index) {
            currentIndex = index;

            // Fade Out
            imgEl.style.opacity = '0';
            imgEl.style.transform = 'scale(0.98)';

            setTimeout(() => {
                const activeSrc = images[currentIndex];
                imgEl.src = activeSrc;

                // Update Action Buttons URL
                const waMessage = "Hi Fashluxee,\nI would like to talk about this item:\n" + encodeURIComponent(location.href);
                whatsappBtn.href = "https://api.whatsapp.com/send?phone=919503021689&text=" + encodeURIComponent(waMessage);
                downloadBtn.href = activeSrc;

                // Update bullet indicators
                if (images.length > 1) {
                    Array.from(bulletsContainer.children).forEach((dot, idx) => {
                        if (idx === currentIndex) {
                            dot.className = "w-2 h-2 rounded-full cursor-pointer transition-all duration-300 bg-[#c8a97e] scale-125 shadow-[0_0_8px_#c8a97e]";
                        } else {
                            dot.className = "w-2 h-2 rounded-full cursor-pointer transition-all duration-300 bg-white/30 hover:bg-white/60";
                        }
                    });
                }

                // Fade In on load
                imgEl.onload = () => {
                    imgEl.style.opacity = '1';
                    imgEl.style.transform = 'scale(1)';
                };
            }, 150);
        }

        function nextSlide() {
            let nextIndex = (currentIndex + 1) % images.length;
            updateSlide(nextIndex);
        }

        function prevSlide() {
            let prevIndex = (currentIndex - 1 + images.length) % images.length;
            updateSlide(prevIndex);
        }

        function goToSlide(index) {
            if (index !== currentIndex) {
                updateSlide(index);
            }
        }

        // Toggle full size scale click
        imgEl.addEventListener('click', function() {
            this.classList.toggle('scale-[1.14]');
            this.classList.toggle('cursor-zoom-out');
            this.classList.toggle('cursor-zoom-in');
        });

        // Add keyboard arrow support
        document.addEventListener('keydown', function(event) {
            if (images.length > 1) {
                if (event.key === 'ArrowRight') {
                    nextSlide();
                } else if (event.key === 'ArrowLeft') {
                    prevSlide();
                }
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initCarousel);
    </script>
